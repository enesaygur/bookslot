name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookslot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bookslot_test
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install prisma generate
      - run: npm run build
      - run: npx --no-install prisma migrate deploy
      - run: npm test